<section class="evaluasi">
    <style>
        @page { size: A4 landscape; margin: 15mm 12mm 18mm 12mm; }
        .evaluasi { font-family: Arial, Helvetica, sans-serif; font-size: 8.5pt; line-height: 1.3; color: #000; }
        .evaluasi table { border-collapse: collapse; width: 100%; margin: 0; }
        .evaluasi .head td, .evaluasi .info td { border: none; padding: 1px 0; vertical-align: top; }
        .evaluasi .head .company { font-weight: bold; font-size: 9.5pt; line-height: 1.35; padding-left: 8px; vertical-align: middle; }
        .evaluasi .title { text-align: center; font-weight: bold; font-size: 10pt; text-decoration: underline; margin: 14px 0 6px; }
        .evaluasi table.items { border: 1.5px solid #000; }
        .evaluasi table.items th { border: 1px solid #000; background: #c9c9c9; font-weight: bold; text-align: center; vertical-align: middle; padding: 2px 3px; }
        .evaluasi table.items td { border-left: 1px solid #000; border-right: 1px solid #000; border-top: none; border-bottom: none; padding: 1px 3px; vertical-align: top; }
        .evaluasi table.items tr:last-child td { border-bottom: 1px solid #000; }
        .evaluasi .center { text-align: center; }
        .evaluasi .right { text-align: right; }
        .evaluasi .info { margin-top: 14px; width: auto; }
        .evaluasi .info td.label { width: 140px; }
        .evaluasi .info td.colon { width: 12px; }
    </style>

    <table class="head">
        <tr>
            <td style="width: 112px;"><img src="/logo/sidebar-logo.png" alt="PT PLN Nusantara Power" style="height: 34px; width: auto;"></td>
            <td class="company">PT PLN Nusantara Power<br>UP Kendari</td>
        </tr>
    </table>

    <div class="title">EVALUASI HARGA PERKIRAAN ENJINIRING</div>

    <table class="items">
        <tr>
            <th rowspan="2" style="width: 3%;">No.</th>
            <th rowspan="2" style="width: 7%;">Stock Code</th>
            <th rowspan="2" style="width: 21%;">Nama Barang dan Spesifikasi</th>
            <th colspan="4">Harga</th>
            <th rowspan="2" style="width: 11%;">CALON MITRA 1</th>
            <th rowspan="2" style="width: 11%;">CALON MITRA 2</th>
            <th rowspan="2" style="width: 10%;">Harga HPE</th>
        </tr>
        <tr>
            <th style="width: 8%;">No PO</th>
            <th style="width: 8%;">Tgl PO</th>
            <th style="width: 7%;">Supplier</th>
            <th style="width: 11%;">Harga Lalu</th>
        </tr>
        <tr>
            <td class="center">1</td>
            <td></td>
            <td>{{nama_pengadaan}}</td>
            <td></td>
            <td></td>
            <td></td>
            <td>0,00</td>
            <td></td>
            <td></td>
            <td class="right">{{nilai_hpe_angka}},00</td>
        </tr>
        <tr class="blank"><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr class="blank"><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    </table>

    <table class="info">
        <tr><td class="label">Informasi Tambahan</td><td class="colon">:</td><td></td></tr>
        <tr><td class="label">RKAP Budget</td><td class="colon">:</td><td>0,00</td></tr>
    </table>
</section>
